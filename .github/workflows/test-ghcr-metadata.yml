name: Test GHCR Metadata

on:
  push:
    branches: ['main']
    tags: ['v*.*.*']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Automatically generate tags based on Git context
      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/test-metadata-image

      # Step 3: Pull a tiny, ready-to-use public image
      - name: Pull sample Docker image
        run: docker pull alpine:latest

      # Step 4: Tag and push using metadata-action's output
      - name: Tag and push image
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            if [ -n "$tag" ]; then
              docker tag alpine:latest "$tag"
              docker push "$tag"
            fi
          done
