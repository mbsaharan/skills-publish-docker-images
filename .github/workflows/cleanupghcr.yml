name: Cleanup GHCR

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: 'alpine-image'
          package-type: 'container'
          min-versions-to-keep: 2
