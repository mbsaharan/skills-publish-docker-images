name: Demo Docker publish and prune

on:
  workflow_dispatch:

jobs:
  build-and-prune:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Prune old Docker images
        uses: actions/delete-package-versions@v5
        with:
          # Must match the package name exactly as shown in GHCR
          package-name: alpine-image
          package-type: container
          min-versions-to-keep: 2
