name: Demo Docker publish and prune

on:
  workflow_dispatch:

jobs:
  build-and-prune:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Alpine
        run: docker pull alpine:latest

      - name: Tag image
        run: docker tag alpine:latest ghcr.io/${{ github.repository_owner }}/demo-image:${{ github.run_number }}

      - name: Push image
        run: docker push ghcr.io/${{ github.repository_owner }}/demo-image:${{ github.run_number }}

      - name: Prune old Docker images
        uses: actions/delete-package-versions@v4
        with:
          # Must match the package name exactly as shown in GHCR
          package-name: demo-image
          package-type: container
          min-versions-to-keep: 2
