name: Demo publish and prune

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://npm.pkg.github.com'

      - name: Create dummy package
        run: |
          echo '{
            "name": "@${{ github.repository_owner }}/demo-package",
            "version": "0.0.${{ github.run_number }}",
            "main": "index.js"
          }' > package.json
          echo 'console.log("Hello demo v${{ github.run_number }}");' > index.js

      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old versions
        uses: actions/delete-package-versions@v4
        with:
          package-name: demo-package
          package-type: npm
          min-versions-to-keep: 2
