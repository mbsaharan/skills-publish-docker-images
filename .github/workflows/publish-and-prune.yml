name: Demo Docker publish and prune

on:
  workflow_dispatch:

jobs:
  build-and-prune:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build unique image
        run: |
          cat > Dockerfile <<EOF
          FROM alpine:latest
          LABEL run_number=${{ github.run_number }}
          LABEL run_id=${{ github.run_id }}
          RUN echo "${{ github.run_number }} - $(date -u +%s)" > /version
          EOF
          docker build -t ghcr.io/${{ github.repository_owner }}/alpine-image:${{ github.run_number }} .

      - name: Push image
        run: docker push ghcr.io/${{ github.repository_owner }}/alpine-image:${{ github.run_number }}

      - name: Prune old Docker images
        uses: actions/delete-package-versions@v5
        with:
          package-name: alpine-image
          package-type: container
          min-versions-to-keep: 2
