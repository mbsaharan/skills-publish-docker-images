name: Demo Docker publish and prune

on:
  workflow_dispatch:

jobs:
  build-and-prune:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build unique image
        run: |
          echo "${{ github.run_number }}" > VERSION
          echo "FROM alpine:latest
          LABEL org.opencontainers.image.version=${{ github.run_number }}
          COPY VERSION /VERSION" | docker build -t ghcr.io/${{ github.repository_owner }}/demo-image:${{ github.run_number }} .

      - name: Push image
        run: docker push ghcr.io/${{ github.repository_owner }}/demo-image:${{ github.run_number }}

      - name: Prune old Docker images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'demo-image'
          package-type: 'container'
          min-versions-to-keep: 2
          delete-only-untagged-versions: false
          token: ${{ secrets.GITHUB_TOKEN }}
