name: Publish and Prune Docker Image

on:
  workflow_dispatch:

jobs:
  build-and-prune:
    runs-on: ubuntu-latest

    # Important: allow pushing images and deleting package versions
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Log in to GHCR with GITHUB_TOKEN
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Pull a tiny base image (Alpine)
      - name: Pull sample Docker image
        run: docker pull alpine:latest

      # Step 3: Tag it with a unique version (run number)
      - name: Tag image for GHCR
        run: docker tag alpine:latest ghcr.io/${{ github.repository_owner }}/demo-image:${{ github.run_number }}

      # Step 4: Push the image to GHCR
      - name: Push image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/demo-image:${{ github.run_number }}

      # Step 5: Prune old versions, keep only the latest 2
      - name: Prune old Docker images
        uses: actions/delete-package-versions@v4
        with:
          package-name: demo-image
          package-type: docker
          min-versions-to-keep: 2
